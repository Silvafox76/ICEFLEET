# Render Blueprint for ICE FLEET
# Auto-deploy configuration for Render.com

services:
  # PostgreSQL Database
  - type: pserv
    name: icefleet-db
    env: docker
    plan: starter  # Change to 'free' for testing, 'starter' for production
    databases:
      - name: icefleet
        databaseName: icefleet
        user: icefleet_user

  # Web Service (Next.js Application)
  - type: web
    name: icefleet-app
    env: node
    plan: starter  # Change to 'free' for testing, 'starter' for production
    buildCommand: cd app && npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: cd app && npx prisma migrate deploy && npm start
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio

    # Health check configuration
    healthCheckPath: /api/health

    # Auto-deploy settings
    autoDeploy: true
    branch: master  # or 'main' depending on your default branch

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: icefleet-db
          property: connectionString

      - key: NEXTAUTH_SECRET
        generateValue: true  # Render will generate a secure random string

      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: icefleet-app
          property: host
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_PUBLIC_APP_NAME
        value: ICE FLEET

      # Optional: Add these if you need them
      # - key: ICE_CRM_API_KEY
      #   sync: false  # Set manually in Render dashboard

      # - key: ICE_CERT_API_KEY
      #   sync: false  # Set manually in Render dashboard

      # - key: MAPBOX_API_KEY
      #   sync: false  # Set manually in Render dashboard
