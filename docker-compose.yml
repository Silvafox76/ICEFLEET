version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: icefleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icefleet_secure_password}
      POSTGRES_DB: icefleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ICE FLEET Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icefleet-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-icefleet_secure_password}@postgres:5432/icefleet

      # Application
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: "ICE FLEET"

      # NextAuth (optional for future use)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-generate_with_openssl_rand_base64_32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # ICEHUB Integration (configure when integrating)
      ICE_CRM_API_URL: ${ICE_CRM_API_URL:-}
      ICE_CRM_API_KEY: ${ICE_CRM_API_KEY:-}
      ICE_CERT_API_URL: ${ICE_CERT_API_URL:-}
      ICE_CERT_API_KEY: ${ICE_CERT_API_KEY:-}

      # Optional Services
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  default:
    name: icefleet-network
